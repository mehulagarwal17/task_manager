{% extends 'base.html' %}

{% block content %}
<div class="auth-form">
    <div class="card">
        <h2>Welcome Back</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: #ccc;">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--bright-pink);">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
