{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>{% if form.instance.pk %}Edit Task{% else %}Create New Task{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.title.id_for_label }}">Task Title</label>
            {{ form.title }}
        </div>
        <div class="form-group">
            <label for="{{ form.description.id_for_label }}">Description</label>
            {{ form.description }}
        </div>
        <div class="form-group">
            <label for="{{ form.completed.id_for_label }}">
                {{ form.completed }} Mark as completed
            </label>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn">
                {% if form.instance.pk %}Update Task{% else %}Create Task{% endif %}
            </button>
            <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
