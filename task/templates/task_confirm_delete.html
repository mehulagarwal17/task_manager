{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Delete Task</h2>
    <div style="background: rgba(244, 67, 54, 0.1); border: 1px solid rgba(244, 67, 54, 0.3); border-radius: 10px; padding: 1.5rem; margin: 1.5rem 0;">
        <h3 style="color: #f44336; margin-bottom: 1rem;">⚠️ Confirm Deletion</h3>
        <p style="color: #ccc; margin-bottom: 1rem;">Are you sure you want to delete this task?</p>
        <div style="background: rgba(0, 0, 0, 0.3); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
            <h4 style="color: var(--bright-pink); margin-bottom: 0.5rem;">{{ task.title }}</h4>
            {% if task.description %}
                <p style="color: #aaa; margin: 0;">{{ task.description|truncatewords:15 }}</p>
            {% endif %}
        </div>
        <p style="color: #ff9800; font-size: 0.9rem;">This action cannot be undone.</p>
    </div>
    
    <form method="post" style="display: flex; gap: 1rem;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Task</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
